spring.application.name=gst-return-3b-analysis

# ============================================================
# Server Configuration
# ============================================================
server.servlet.context-path=/api
server.port=8087

# ============================================================
# Core Application & Oracle Datasource Configuration
# ============================================================
spring.datasource.hikari.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.jdbc-url=jdbc:oracle:thin:@10.153.181.6:1525:stagedb
spring.datasource.hikari.username=acs_mast
spring.datasource.hikari.password=stage123

# HikariCP Connection Pool Settings (Optimized for Web Requests + Heavy Async ML Jobs)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=gst-ai-HikariPool
spring.datasource.hikari.auto-commit=true

# ============================================================
# GST ITC Risk Configuration
# ============================================================

gst.itc.risk.medium-amount=10000
gst.itc.risk.high-amount=50000
gst.itc.risk.critical-amount=100000

gst.itc.risk.medium-occurrences=2
gst.itc.risk.high-occurrences=3
gst.itc.risk.critical-occurrences=5

gst.itc.risk.high-utilization-percent=90
gst.itc.risk.critical-utilization-percent=100

# =====================================================
# GSTIN Analysis Service Configuration
# =====================================================

# Lookback period for historical returns (in months)
gstin.analysis.lookback-months=24

# Risk Score Thresholds (0.0 - 1.0)
gstin.analysis.risk.high-threshold=0.75
gstin.analysis.risk.medium-threshold=0.40

# ITC Utilization Critical Threshold (0.0 - 1.0)
# Alert when ITC utilization exceeds this percentage
gstin.analysis.itc.critical-threshold=0.98

# Cash Payment High Threshold (0.0 - 1.0)
# Alert when cash payment ratio exceeds this percentage
gstin.analysis.cash.high-threshold=0.80

# Filing Delay High Threshold (in days)
# Alert when filing delay exceeds this number of days
gstin.analysis.filing.delay-high-days=30

app.cors.allowed-origins=http://localhost:5173,http://10.153.43.8:8088,http://192.168.1.20:5173,http://10.10.10.25:80

# Cache Configuration
spring.cache.type=caffeine

# Custom GST Revenue Properties
gst.revenue.scheduler-enabled=true
gst.revenue.scheduler-cron=0 30 2 * * *
gst.revenue.lock-minutes=60
gst.revenue.max-retry=3
gst.revenue.retry-backoff-ms=2000
gst.revenue.history-months=12

# Change only if MASTER_JURI uses another physical office-name column.
#gst.revenue.master-office-name-column=JURISDICTION_NAME

gst.revenue.master-office-name-column=MERGED_JURISDICTION



# ============================================================
# ML / Prediction Layer  Persistent Volume Paths
# ============================================================
# FIXED: Replaced Windows-style local paths (F:/...) with POSIX paths suitable
# for Linux server deployment. Override via env var if the mount point differs
# per-environment.
gst.ml.xgb-rounds=200
gst.ml.lstm-epochs=50

gst.ai.model.dir=./models/
gst.ai.model.auto-generate=true
gst.ai.training.sample-size=10000
gst.ai.training.rounds=50

# FIXED: */50 on the minutes field only fires once an hour (at :00), since 50
# does not evenly divide 60 - it did not mean "every 50 minutes". Changed to
# an explicit hourly run. If a true 50-minute cadence is needed, use a
# fixed-delay @Scheduled task instead, since cron can't express non-divisor
# intervals natively.
gst.ml.training.cron=0 0 * * * *

# ML Retraining Job Configurations
gst.ml.training.enabled=false
gst.ml.training.run-on-startup=true

gst.model.storage-path=/gst-models/models

# >10% diff between R1 and 3B taxable value => mismatch
gst.thresholds.mismatch-tolerance-pct=0.10
# historically filing later than this by more than N days => "high delay" label
gst.thresholds.delay-risk-days=3
# ineligible/eligible ITC ratio above this contributes to risk label
gst.thresholds.ineligible-itc-ratio=0.15
gst.thresholds.reversed-itc-ratio=0.20
gst.thresholds.ecommerce-unregistered-ratio=0.10

gst.xgboost.rounds=150
gst.xgboost.max-depth=5
gst.xgboost.eta=0.1
gst.xgboost.subsample=0.8

# ============================================================
# Production Actuator & Health Diagnostics
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ============================================================
# Logging Configuration
# ============================================================
logging.config=classpath:log4j2.properties
logging.level.root=INFO
logging.level.gov.com.webapp=DEBUG
# FIXED: This previously overrode gov.com.webapp=DEBUG for everything under
# ai.*, silencing the log.debug(...) calls added in GstAnalysisService.
# Scoped to the service package specifically so debug detail (per-GSTIN
# history, missing GSTR-1 rows, raw model scores) is visible without
# widening debug logging across all of gov.com.webapp.ai.
logging.level.gov.com.webapp.ai.service=DEBUG
logging.level.org.deeplearning4j=WARN
logging.level.ml.dmlc.xgboost4j=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
