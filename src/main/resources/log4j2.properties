# ===================================================================
# LOG4J2 CONFIGURATION - GST Return R1 API
# ===================================================================
name = GstReturn3BApiLogConfig

# Status logger for Log4j2 internal operations
status = WARN

# ===================================================================
# APPENDERS
# ===================================================================
appenders = console, rolling

# -------------------------------------------------------------------
# 1. Console Appender (Stdout)
# -------------------------------------------------------------------
appender.console.type = Console
appender.console.name = STDOUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# -------------------------------------------------------------------
# 2. Rolling File Appender (Custom Path & Pattern)
# -------------------------------------------------------------------
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = F:/data/return-3b/logger/gst-return-3b-analysis.log
appender.rolling.filePattern = F:/data/return-3b/logger/gst-return-3b-analysis-%d{dd-MM-yyyy}.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Rotation Trigger: Daily at midnight
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true

# Rollover Strategy (Keep up to 30 archived daily logs)
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 30

# ===================================================================
# LOGGERS & CATEGORIES
# ===================================================================
loggers = app, spring, oracle, hikari

# Application Specific Logger (gov.nic)
logger.app.name = gov.nic
logger.app.level = INFO
logger.app.additivity = false
logger.app.appenderRefs = console, rolling
logger.app.appenderRef.console.ref = STDOUT
logger.app.appenderRef.rolling.ref = RollingFileAppender

# Suppress verbose framework loggers
logger.spring.name = org.springframework
logger.spring.level = WARN

logger.oracle.name = oracle.jdbc
logger.oracle.level = WARN

logger.hikari.name = com.zaxxer.hikari
logger.hikari.level = INFO

# ===================================================================
# ROOT LOGGER
# ===================================================================
rootLogger.level = INFO
rootLogger.appenderRefs = console, rolling
rootLogger.appenderRef.console.ref = STDOUT
rootLogger.appenderRef.rolling.ref = RollingFileAppender